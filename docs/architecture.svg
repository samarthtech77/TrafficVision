<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" style="background-color: #1e1e1e; font-family: Arial, sans-serif;">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #a0a0a0; text-anchor: middle; }
    .box { fill: #2d2d2d; stroke: #007acc; stroke-width: 2; rx: 8; ry: 8; }
    .box-sub { fill: #252526; stroke: #404040; stroke-width: 1.5; rx: 6; ry: 6; }
    .box-title { font-size: 14px; font-weight: bold; fill: #007acc; text-anchor: middle; }
    .text { font-size: 12px; fill: #cccccc; text-anchor: middle; }
    .arrow { stroke: #007acc; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007acc"/>
    </marker>
  </defs>
  
  <text x="450" y="35" class="title">TrafficVision: System Architecture Diagram</text>
  <text x="450" y="55" class="subtitle">CSE3010 Computer Vision BYOP Project</text>
  
  <!-- Video Input -->
  <rect x="50" y="90" width="160" height="60" class="box"/>
  <text x="130" y="118" class="box-title">Video Input</text>
  <text x="130" y="136" class="text">Traffic Video Stream</text>
  
  <!-- Video Processor -->
  <rect x="260" y="90" width="180" height="60" class="box"/>
  <text x="350" y="118" class="box-title">VideoProcessor</text>
  <text x="350" y="136" class="text">Ingestion &amp; Validation</text>

  <!-- Preprocessor -->
  <rect x="490" y="90" width="180" height="60" class="box"/>
  <text x="580" y="118" class="box-title">ImagePreprocessor</text>
  <text x="580" y="136" class="text">Grayscale + CLAHE + Blur</text>

  <!-- Detector -->
  <rect x="710" y="90" width="150" height="60" class="box"/>
  <text x="785" y="118" class="box-title">BaseDetector</text>
  <text x="785" y="136" class="text">MOG2 + Morphology</text>

  <!-- Connectors Row 1 -->
  <line x1="210" y1="120" x2="250" y2="120" class="arrow"/>
  <line x1="440" y1="120" x2="480" y2="120" class="arrow"/>
  <line x1="670" y1="120" x2="700" y2="120" class="arrow"/>
  
  <path d="M 785 150 L 785 200 L 130 200 L 130 240" class="arrow" fill="none"/>

  <!-- Centroid Tracker -->
  <rect x="50" y="240" width="200" height="80" class="box"/>
  <text x="150" y="270" class="box-title">CentroidTracker</text>
  <text x="150" y="290" class="text">Euclidean Distance Matching</text>
  <text x="150" y="308" class="text">&amp; Track History</text>

  <!-- Motion Analyzer -->
  <rect x="310" y="240" width="260" height="80" class="box"/>
  <text x="440" y="270" class="box-title">MotionAnalyzer</text>
  <text x="440" y="290" class="text">Lucas-Kanade (KLT) Optical Flow</text>
  <text x="440" y="308" class="text">&amp; Velocity Vector Estimation</text>

  <!-- Vehicle Counter -->
  <rect x="620" y="240" width="230" height="80" class="box"/>
  <text x="735" y="270" class="box-title">VehicleCounter</text>
  <text x="735" y="290" class="text">2D Vector Cross-Product</text>
  <text x="735" y="308" class="text">Line Crossing Gate</text>

  <!-- Connectors Row 2 -->
  <line x1="250" y1="280" x2="300" y2="280" class="arrow"/>
  <line x1="570" y1="280" x2="610" y2="280" class="arrow"/>

  <!-- Traffic Analyzer -->
  <path d="M 735 320 L 735 370 L 450 370 L 450 400" class="arrow" fill="none"/>
  <rect x="300" y="400" width="300" height="80" class="box"/>
  <text x="450" y="430" class="box-title">TrafficAnalyzer</text>
  <text x="450" y="450" class="text">Flow Rate (N/T) + Active Density</text>
  <text x="450" y="468" class="text">&amp; Traffic Condition Classification</text>

  <!-- Output & Visualizer -->
  <line x1="300" y1="440" x2="200" y2="440" class="arrow"/>
  <line x1="600" y1="440" x2="700" y2="440" class="arrow"/>

  <rect x="50" y="410" width="150" height="60" class="box"/>
  <text x="125" y="438" class="box-title">TrafficVisualizer</text>
  <text x="125" y="456" class="text">HUD + BBoxes + Line</text>

  <rect x="700" y="410" width="160" height="60" class="box"/>
  <text x="780" y="438" class="box-title">TrafficReporter</text>
  <text x="780" y="456" class="text">CSV + JSON + Charts</text>

  <!-- Results Box -->
  <rect x="250" y="530" width="400" height="80" fill="#1b3a4b" stroke="#00b4d8" stroke-width="2" rx="8" ry="8"/>
  <text x="450" y="560" font-size="15" font-weight="bold" fill="#00b4d8" text-anchor="middle">Generated Deliverables (results/)</text>
  <text x="450" y="582" font-size="12" fill="#ffffff" text-anchor="middle">annotated_video.mp4 | traffic_report.csv | traffic_report.json | traffic_analytics.png</text>
</svg>
